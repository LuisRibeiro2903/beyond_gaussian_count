name: Companion checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  evidence-and-core:
    runs-on: ubuntu-latest
    env:
      GS_FRAMEWORK_CITYGAUSSIAN_REFERENCE_REPO: ${{ github.workspace }}/local/reference-citygaussian
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-evidence.txt
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-runtime.txt
      - run: python tools/fetch_citygaussian_reference.py
      - run: python tools/verify_release.py
      - run: python tools/verify_natural_results.py
      - run: python tools/check_publication.py --history
      - run: python reproduction/figures/generate_final_empirical_figures.py --output local/ci-figures
      - name: CPU unit suite
        working-directory: gs_framework
        run: python -m unittest discover -s unit_tests
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: evidence-and-core
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const manifest = JSON.parse(fs.readFileSync('companion.json', 'utf8'));
            const tag = context.ref.slice('refs/tags/'.length);
            if (tag !== `v${manifest.version}`) {
              throw new Error('Tag does not match the verified reader version');
            }
            const repo = { owner: context.repo.owner, repo: context.repo.repo };
            const { data: ref } = await github.rest.git.getRef({ ...repo, ref: `tags/${tag}` });
            let object = ref.object;
            while (object.type === 'tag') {
              const { data } = await github.rest.git.getTag({ ...repo, tag_sha: object.sha });
              object = data.object;
            }
            if (object.type !== 'commit' || object.sha !== context.sha) {
              throw new Error('Published tag differs from the verified commit');
            }
            let exists = false;
            try {
              await github.rest.repos.getReleaseByTag({ ...repo, tag });
              exists = true;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            if (exists) throw new Error('Existing releases are never overwritten');
            await github.rest.repos.createRelease({
              ...repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `Beyond Gaussian Count ${tag}`,
              body: `Reader companion with the CityGaussian and ALoD reproductions, ALoD-Ext runtime, thirteen canonical result records, and verification scripts.\n\nThis version streamlines the research documentation, uses the current repository URLs and ALoD-Ext terminology, and preserves the complete v1.0.0 evidence unchanged. See README.md, docs/REPRODUCING.md, docs/EXTERNAL_INPUTS.md and LICENSE.md for reproduction scope and reuse terms.\n\nReader commit: ${context.sha}`,
              draft: false,
              prerelease: false
            });
