name: Companion checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  evidence-and-core:
    runs-on: ubuntu-latest
    env:
      GS_FRAMEWORK_CITYGAUSSIAN_REFERENCE_REPO: ${{ github.workspace }}/local/reference-citygaussian
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-evidence.txt
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-runtime.txt
      - run: python tools/fetch_citygaussian_reference.py
      - run: python tools/verify_release.py
      - run: python tools/verify_natural_results.py
      - run: python tools/check_publication.py --history
      - run: python reproduction/figures/generate_final_empirical_figures.py --output local/ci-figures
      - name: CPU unit suite
        working-directory: gs_framework
        run: python -m unittest discover -s unit_tests
