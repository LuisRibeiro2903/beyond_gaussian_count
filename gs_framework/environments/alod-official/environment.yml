name: alod_official
channels:
  - nvidia
  - conda-forge
dependencies:
  - python=3.10.20
  - cuda-toolkit=12.8.2
  - cmake=4.4.2
  - ninja=1.13.2
  - gcc_linux-64=13.4.0
  - gxx_linux-64=13.4.0
  - pip=26.2.1
  - wheel=0.47.0
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu128
      - torch==2.11.0+cu128
      - torchvision==0.26.0+cu128
      - gsplat==1.5.3

# This is the portable top-level specification. Use conda-explicit.txt for an
# exact linux-64 Conda replay, pip-freeze.txt for the resolved Python inventory,
# and build-commands.sh for the required wheel indexes and native source builds.
